name: Upgrade Gradle

on:
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./HanbatNotice
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Upgrade Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.11.1
          ./gradlew wrapper --gradle-version 8.11.1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gradle-wrapper
          path: |
            HanbatNotice/gradle/wrapper/
            HanbatNotice/gradlew
            HanbatNotice/gradlew.bat
